name = "mintly"
main = "src/index.js"
compatibility_date = "2026-01-01"

# One D1 database per Mintly deployment. All apps live inside it.
# Run `npm run setup` (or `node scripts/setup.mjs`) to create it and fill this id.
[[d1_databases]]
binding = "DB"
database_name = "mintly"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

[vars]
# Days of data the dashboard queries by default (1-365).
DEFAULT_RANGE_DAYS = "7"
# Set to "1" to reject events whose dim1 is not in the app registry.
REGISTRY_ENFORCE = "0"

# Secrets (set with `wrangler secret put <NAME>`):
#   STATS_TOKEN  read-only token used by the dashboard and `mintly stats`
#   ADMIN_TOKEN  admin token used to create apps and edit the registry
